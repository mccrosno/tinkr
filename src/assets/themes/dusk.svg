<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- "Dusk": a dark sky with three soft glows drifting slowly (SMIL animation, so it
       animates as a CSS background too). Radial gradients instead of blur filters:
       cheap to redraw every frame, even without a GPU. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12121c"/>
      <stop offset="0.6" stop-color="#1b1626"/>
      <stop offset="1" stop-color="#2a1a22"/>
    </linearGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
      <stop offset="0" stop-color="#7b5cc7" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#7b5cc7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal">
      <stop offset="0" stop-color="#3f9aa6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3f9aa6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <ellipse cx="1150" cy="820" rx="700" ry="420" fill="url(#ember)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -160 -40; 0 0" dur="38s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="350" cy="250" rx="620" ry="380" fill="url(#violet)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 140 60; 0 0" dur="46s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="800" cy="500" rx="520" ry="300" fill="url(#teal)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 80 -90; -60 40; 0 0" dur="54s" repeatCount="indefinite"/>
  </ellipse>
</svg>
