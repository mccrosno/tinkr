[package]
name = "tinkr"
version = "0.1.0"
description = "Modular agentic code editor"
authors = ["Matthew Crosno"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's (a Windows quirk:
# https://github.com/rust-lang/cargo/issues/8519).
name = "tinkr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = { version = "2.7.1", features = ["watch"] }
tauri-plugin-opener = "2"

[target.'cfg(windows)'.dependencies]
win32job = "2.1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
